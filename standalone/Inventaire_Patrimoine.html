<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventaire documentaire du patrimoine</title>
<style>
:root { --brand: #102a4a; --brand-2: #3a9ad9; --ok: #1f9d63; --warn: #e08a14; --ko: #d93f49; --na: #8a94a3; --line: #e3e8ef; --bg: #f5f7fa; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #1d2733; background: var(--bg); }
a { color: var(--brand-2); }
#top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: var(--brand); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
#top .brand { font-weight: 700; font-size: 16px; text-decoration: none; color: #fff; }
#top .brand small { font-weight: 400; opacity: .7; margin-left: 6px; }
#top .grow { flex: 1; }
#storage { font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; }
#storage .dot { width: 9px; height: 9px; border-radius: 50%; background: #8a94a3; display: inline-block; }
#storage .dot.ok { background: #4cd38f; } #storage .dot.pending { background: #f3c14b; } #storage .dot.ko { background: #ff6b74; }
#who { font-size: 12.5px; }
#who button { color: #cfe6f7; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-items { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: #1d2733; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); min-width: 290px; padding: 6px; z-index: 60; }
.menu-items button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; font: inherit; color: inherit; }
.menu-items button:hover { background: #eef3f9; }
.menu-items hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

#banner:empty { display: none; }
#banner { padding: 10px 20px; background: #fdecd0; color: #5d3a00; border-bottom: 1px solid #f0c98a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#banner.ko { background: #fbe3e5; color: #7a1d24; border-color: #f1b4b9; }

#app { max-width: 1280px; margin: 0 auto; padding: 8px 16px 64px; }
#app h1 { font-size: 26px; font-weight: 700; color: var(--brand); margin: 8px 0; }
#app h2 { font-size: 18px; font-weight: 700; color: var(--brand); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
#app h2 small { display: flex; align-items: center; gap: 8px; font-weight: 400; }
#app h3 { font-size: 15px; font-weight: 700; margin: 22px 0 8px; color: #44546a; text-transform: uppercase; letter-spacing: .04em; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.topprog { display: flex; align-items: center; gap: 10px; min-width: 260px; }
.crumb { margin: 8px 0; color: #5b6b7f; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin: 16px 0; box-shadow: 0 1px 3px rgba(16,42,74,.06); }
.sub { color: #6b7a8d; font-size: 12.5px; }
.empty { padding: 40px 16px; text-align: center; color: #5b6b7f; }
.welcome { max-width: 720px; margin: 40px auto; }
.welcome ol { padding-left: 20px; } .welcome li { margin: 4px 0; }
.welcome .choices { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

.btn { display: inline-block; padding: 7px 14px; border-radius: 6px; border: 1px solid #cfd7e2; background: #fff; color: #1d2733; font: inherit; cursor: pointer; text-decoration: none; }
.btn:hover { background: #f0f4f9; }
.btn-primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn-primary:hover { background: #2a86c3; }
.btn-light { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); color: #fff; }
.btn-light:hover { background: rgba(255,255,255,.22); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn-xs { padding: 2px 8px; font-size: 12px; }
.btn-link { border: 0; background: none; color: var(--brand-2); padding: 2px 4px; cursor: pointer; font: inherit; font-size: 12px; }
.btn-link:hover { text-decoration: underline; background: none; }
.btn-danger { color: var(--ko); }

.bar { display: inline-block; width: 140px; height: 8px; background: #e6ebf2; border-radius: 99px; overflow: hidden; vertical-align: middle; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--ok)); }
.pct { margin-left: 8px; font-weight: 600; font-size: 12.5px; }

.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.site { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; background: var(--bg); transition: box-shadow .15s, transform .15s; }
.site:hover { box-shadow: 0 8px 22px rgba(16,42,74,.14); transform: translateY(-2px); }
.site strong { color: var(--brand); font-size: 15px; }
.chips em, .gp em, .contrat em, .alerts em { font-style: normal; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: #e6ebf2; color: #44546a; margin-right: 6px; white-space: nowrap; }
em.ko { background: #fbe3e5 !important; color: #a82a33 !important; }
em.warn { background: #fdecd0 !important; color: #8a5200 !important; }
.alerts { width: 100%; border-collapse: collapse; }
.alerts td, .alerts th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eef1f6; font-size: 13px; }
.alerts th { font-size: 11.5px; text-transform: uppercase; color: #6b7a8d; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 18px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: #5b6b7f; margin-bottom: 3px; }
#app input[type=text], #app input[type=number], #app input[type=date], #app select, #app textarea { width: 100%; padding: 6px 8px; border: 1px solid #cfd7e2; border-radius: 6px; background: #fff; font: inherit; font-size: 13.5px; }
#app input:focus, #app select:focus, #app textarea:focus { outline: 2px solid var(--brand-2); outline-offset: 0; }

.bats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bat { display: flex; flex-direction: column; gap: 4px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--brand); font-weight: 600; text-decoration: none; }
.bat .bar { width: 110px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.toolbar select { width: auto !important; }
.group { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: #fff; }
.group > summary { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; font-weight: 600; background: #f0f4f9; border-radius: 8px; }
.rows { padding: 6px 12px 12px; overflow-x: auto; }
.row { display: grid; grid-template-columns: minmax(200px, 3fr) 140px 135px 110px minmax(170px, 1.7fr) minmax(140px, 2fr); gap: 8px 10px; align-items: center; padding: 7px 8px; border-bottom: 1px solid #eef1f6; border-left: 4px solid transparent; min-width: 930px; }
.row-h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: #6b7a8d; font-weight: 700; border-left-color: transparent !important; }
.row.s-ok { border-left-color: var(--ok); } .row.s-warn { border-left-color: var(--warn); }
.row.s-ko { border-left-color: var(--ko); } .row.s-na { border-left-color: var(--na); }
.row.hidden { display: none; }
.row.drop, .contrat.drop { background: #e7f3fc; outline: 2px dashed var(--brand-2); }
.lab { font-weight: 500; }
.by { display: block; font-size: 11px; font-weight: 400; color: #8a94a3; }
.files { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; font-size: 12px; min-width: 0; }
.files .f { display: flex; gap: 2px; align-items: center; max-width: 100%; }
.files .f a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.files .f.missing a { color: var(--ko); text-decoration: line-through; }

.contrat { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; padding: 12px; margin: 8px 0; border: 1px dashed #c5cfdd; border-radius: 8px; background: #fafbfd; }
.ctail { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; flex-wrap: wrap; }

#toast { position: fixed; right: 18px; bottom: 18px; padding: 10px 16px; border-radius: 8px; color: #fff; background: var(--ok); box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; z-index: 2000; max-width: 460px; }
#toast.ko { background: var(--ko); } #toast.info { background: var(--brand); } #toast.show { opacity: 1; transform: none; }
@media (max-width: 767px) { .bar { width: 90px; } #app h1 { font-size: 21px; } #top { padding: 8px 12px; } }
@media print { #top, #banner, .btn, .btn-link, .toolbar { display: none !important; } .card { box-shadow: none; } }
</style>
</head>
<body>
<header id="top">
  <a class="brand" href="#/">Inventaire documentaire du patrimoine<small>FSJD</small></a>
  <span class="grow"></span>
  <span id="storage"></span>
  <span id="who"></span>
  <button type="button" class="btn btn-light btn-sm" data-act="export-zip" id="btn-zip">Exporter (.zip)</button>
  <details class="menu" id="menu">
    <summary class="btn btn-light btn-sm" title="Autres actions">☰</summary>
    <div class="menu-items">
      <button type="button" data-act="export-zip">Exporter tout l'inventaire en dossier compressé (.zip)</button>
      <button type="button" data-act="export-csv">Exporter la synthèse des documents (.csv)</button>
      <button type="button" data-act="export-csv-contrats">Exporter la synthèse des contrats (.csv)</button>
      <hr>
      <button type="button" data-act="import-zip">Importer un inventaire (.zip)…</button>
      <button type="button" data-act="check-files">Vérifier la présence des fichiers</button>
      <hr>
      <button type="button" data-act="link-folder">Changer de dossier de l'inventaire…</button>
      <button type="button" data-act="unlink-folder">Délier le dossier</button>
    </div>
  </details>
</header>
<div id="banner"></div>
<main id="app"><p class="empty">Chargement…</p></main>
<div id="toast" role="status"></div>

      var copy = ext.text != null ? writeBlob(BACKUP_DIR + '/inventaire-donnees-externe-' + ts + '.json', new Blob([ext.text])) : Promise.resolve();
      copy.then(function () {

        lastText = ext.text; conflict = null; dirty = true; renderBanner(); return save();

  /* --- Liaison du dossier --- */

  function attachTo(target, files) {
    if (!canWrite()) { return Promise.resolve(); }
    var list = [].slice.call(files || []);
    var big = list.filter(function (f) { return f.size > MAX_FILE_MB * 1048576; });
    if (big.length) { toast('Fichier trop volumineux (max ' + MAX_FILE_MB + ' Mo) : ' + big[0].name, 'ko'); }
    list = list.filter(function (f) { return big.indexOf(f) < 0; });
    if (!list.length) { return Promise.resolve(); }
    var rec = target.rec(true), dir = target.dir();
    toast('Enregistrement de ' + list.length + ' fichier' + (list.length > 1 ? 's' : '') + '…', 'info');
    return list.reduce(function (p, file) {
      return p.then(function () {
        return uniquePath(dir, file.name).then(function (path) {
          return writeBlob(path, file).then(function () {
            rec.fichiers.push({ nom: splitPath(path).name, chemin: path, taille: file.size, ajoute_le: nowIso(), ajoute_par: who() });
          });
        });
      });
    }, Promise.resolve()).then(function () {
      if (target.onAttach) { target.onAttach(rec); }
      stamp(rec); markDirty(); target.refresh();
      toast(list.length > 1 ? list.length + ' fichiers enregistrés' : 'Fichier enregistré');
    }).catch(function (e) { toast('Échec de l’enregistrement du fichier : ' + e.message, 'ko'); target.refresh(); markDirty(); });
  }
  function detachFrom(target, i) {
    var rec = target.rec(false); if (!rec || !rec.fichiers[i]) { return; }
    var f = rec.fichiers[i];
    var msg = store.mode === 'folder'
      ? 'Retirer « ' + f.nom + ' » ? Le fichier est déplacé dans le dossier ' + TRASH_DIR + '/ (vous pourrez le supprimer vous-même).'
      : 'Retirer et supprimer « ' + f.nom + ' » ?';
    if (!window.confirm(msg)) { return; }
    var op = store.mode === 'folder' ? moveFile(f.chemin, [TRASH_DIR, localDate()]) : removeFile(f.chemin);
    op.catch(function () { /* fichier déjà absent : on retire seulement la ligne */ }).then(function () {
      rec.fichiers.splice(i, 1); stamp(rec); markDirty(); target.refresh(); toast('Fichier retiré');
    });
  }
  function openAttachment(path, name) {
    var w = null;
    var viewable = /\.(pdf|png|jpe?g|gif|webp|txt|svg)$/i.test(name);
    if (viewable) { w = window.open('', '_blank'); }
    readBlob(path).then(function (blob) {
      var url = URL.createObjectURL(blob);
      if (w) { w.location.href = url; } else { download(blob, name); }
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
    }, function () {

    });
  }

  function relocateFiles() {

    if (!moves.length) { return Promise.resolve(); }
    toast('Rangement de ' + moves.length + ' fichier(s) dans les dossiers renommés…', 'info');
    return moves.reduce(function (p, a) {
      return p.then(function () { return moveFile(a.f.chemin, a.dir).then(function (to) { a.f.chemin = to; a.f.nom = splitPath(to).name; }, function () { /* manquant */ }); });
    }, Promise.resolve()).then(function () { markDirty(); toast('Fichiers rangés'); });
  }
  function trashFilesOf(atts) {
    if (!atts.length) { return Promise.resolve(); }

  function checkFiles() {

    }, Promise.resolve()).then(function () {
      render(true);
      if (!missing.length) { toast(atts.length + ' fichier(s) vérifié(s) : tous présents'); }

          lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, method, true);
          lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
          lh.setUint32(18, csize, true); lh.setUint32(22, raw.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
          var ch = new DataView(new ArrayBuffer(46));
          ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, method, true);
          ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, csize, true); ch.setUint32(24, raw.length, true);
          ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
          parts.push(lh.buffer, name, body); central.push(ch.buffer, name);
          offset += 30 + name.length + csize;
          if (offset > 0xFFFFFFFF) { throw new Error('archive de plus de 4 Go : exportez établissement par établissement'); }
        });
      });
    }
    return entries.reduce(function (p, e) {
      return p.then(function () { return one(e); }).then(function () { i++; if (onProgress) { onProgress(i, entries.length); } });
    }, Promise.resolve()).then(function () {
      var cdSize = central.reduce(function (s, x) { return s + x.byteLength; }, 0);
      var end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      return new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
    });
  }
  function readZip(file) {
    return file.arrayBuffer().then(function (ab) {
      var u8 = new Uint8Array(ab), dv = new DataView(ab), i, dec = new TextDecoder();
      for (i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { break; } }
      if (i < Math.max(0, u8.length - 65557)) { throw new Error('ce fichier n’est pas une archive .zip valide'); }
      var n = dv.getUint16(i + 10, true), p = dv.getUint32(i + 16, true), out = [];
      for (var k = 0; k < n; k++) {
        if (dv.getUint32(p, true) !== 0x02014b50) { throw new Error('archive .zip endommagée'); }
        var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
        var nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
        var name = dec.decode(u8.subarray(p + 46, p + 46 + nl)).replace(/\\/g, '/');
        p += 46 + nl + xl + cl;
        if (/\/$/.test(name)) { continue; }
        out.push({ name: name, method: method, csize: csize, lho: lho });
      }
      out.forEach(function (e) {
        e.blob = function () {
          var s = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true), raw = u8.subarray(s, s + e.csize);
          if (e.method === 0) { return Promise.resolve(new Blob([raw])); }
          if (e.method === 8 && typeof window.DecompressionStream === 'function') { return pipe(raw, new DecompressionStream('deflate-raw')).then(function (x) { return new Blob([x]); }); }
          return Promise.reject(new Error('méthode de compression non prise en charge (' + e.method + ') pour ' + e.name));
        };
      });
      return out;
    });
  }

  function exportZip(filterEtab) {
    flush().then(function () {
      var sub = filterEtab ? subsetFor(filterEtab) : db;
      var rootName = 'Inventaire_' + seg(filterEtab ? db.etablissements[filterEtab].nom : 'patrimoine', 40).replace(/ /g, '_') + '_' + localDate();
      var entries = [
        { name: rootName + '/' + DATA_FILE, data: filterEtab ? JSON.stringify(sub, null, 1) : serialize() },
        { name: rootName + '/synthese_documents.csv', data: csvDocuments(filterEtab) },
        { name: rootName + '/synthese_contrats.csv', data: csvContrats(filterEtab) },
        { name: rootName + '/Inventaire_Patrimoine.html', data: SELF_HTML },
        { name: rootName + '/LISEZMOI.txt', data: readme() }
      ];
      var atts = allAttachments(filterEtab), missing = [];
      return atts.reduce(function (p, a) {
        return p.then(function () {
          return readBlob(a.f.chemin).then(function (b) { entries.push({ name: rootName + '/' + a.f.chemin, data: b, date: b.lastModified ? new Date(b.lastModified) : null }); },
            function () { missing.push(a.f.chemin); });
        });
      }, Promise.resolve()).then(function () {
        return buildZip(entries, function (i, n) { if (n > 10) { toast('Compression… ' + i + ' / ' + n, 'info'); } });
      }).then(function (zip) {
        download(zip, rootName + '.zip');
        toast('Archive créée (' + sizeLabel(zip.size) + ')' + (missing.length ? ' — ' + missing.length + ' fichier(s) introuvable(s) non inclus' : ''), missing.length ? 'ko' : 'ok');
      });
    }).catch(function (e) { toast('Export impossible : ' + e.message, 'ko'); });
  }
  function subsetFor(etabId) {
    var s = emptyDB(); s.cree_le = db.cree_le; s.modifie_le = db.modifie_le;
    s.etablissements[etabId] = db.etablissements[etabId];
    var owners = [etabId];
    batsOf(etabId).forEach(function (b) { s.batiments[b.id] = b; owners.push(b.id); });
    Object.keys(db.documents).forEach(function (k) { if (owners.indexOf(k.split('|')[0]) >= 0) { s.documents[k] = db.documents[k]; } });
    vals(db.docs_perso).forEach(function (p) { if (owners.indexOf(p.owner_id) >= 0) { s.docs_perso[p.id] = p; } });
    vals(db.contrats).forEach(function (c) { if (owners.indexOf(c.bat_id) >= 0) { s.contrats[c.id] = c; } });
    return s;
  }
  function readme() {
    return 'Inventaire documentaire du patrimoine - FSJD\r\nExporté le ' + frDateTime(nowIso()) + ' par ' + (auteur || '?') + '\r\n\r\n' +
      'Contenu :\r\n' +
      '  ' + DATA_FILE + '         toutes les saisies (format JSON)\r\n' +
      '  synthese_documents.csv           tableau des documents (Excel : séparateur ;)\r\n' +
      '  synthese_contrats.csv            tableau des contrats\r\n' +
      '  ' + FILES_DIR + '/                         documents déposés : Établissement / _Site ou Bâtiment / Catégorie / Document\r\n' +
      '  Inventaire_Patrimoine.html       l\'outil de saisie\r\n\r\n' +
      'Pour reprendre la saisie : extraire l\'archive, ouvrir Inventaire_Patrimoine.html avec Chrome ou Edge,\r\n' +
      'puis choisir le dossier extrait (celui qui contient ' + DATA_FILE + ').\r\n';
  }

  function importZip(file) {
    flush().then(function () { return readZip(file); }).then(function (entries) {
      var data = entries.filter(function (e) { return e.name === DATA_FILE || /\/inventaire-donnees\.json$/.test(e.name); })
        .sort(function (a, b) { return a.name.length - b.name.length; })[0];
      if (!data) { throw new Error('aucun fichier ' + DATA_FILE + ' dans l’archive'); }
      var prefix = data.name.slice(0, data.name.length - DATA_FILE.length);
      return data.blob().then(function (b) { return b.text(); }).then(function (text) {
        var incoming = normalize(JSON.parse(text));
        var nE = Object.keys(incoming.etablissements).length;
        var hasCurrent = Object.keys(db.etablissements).length > 0;
        var mode = 'replace';
        if (hasCurrent) {
          var ans = window.prompt('L’archive contient ' + nE + ' établissement(s).\n\n' +
            'Tapez 1 pour AJOUTER ces établissements à l’inventaire actuel (ceux qui existent déjà sont remplacés par la version de l’archive),\n' +
            'ou 2 pour REMPLACER tout l’inventaire actuel (une copie est gardée dans ' + BACKUP_DIR + '/).', '1');
          if (ans === null) { return; }
          mode = ans.trim() === '2' ? 'replace' : 'merge';
        }
        var files = entries.filter(function (e) { return e.name.indexOf(prefix + FILES_DIR + '/') === 0; });
        toast('Import de ' + files.length + ' fichier(s)…', 'info');
        var pre = hasCurrent && store.mode === 'folder'
          ? writeBlob(BACKUP_DIR + '/inventaire-donnees-avant-import-' + stampName() + '.json', new Blob([serialize()])) : Promise.resolve();
        return pre.then(function () {
          return files.reduce(function (p, e, i) {
            return p.then(function () { return e.blob(); }).then(function (b) {
              if (files.length > 10 && i % 5 === 0) { toast('Import… ' + (i + 1) + ' / ' + files.length, 'info'); }
              return writeBlob(e.name.slice(prefix.length), b);
            });
          }, Promise.resolve());
        }).then(function () {
          if (mode === 'replace') { db = incoming; }
          else {
            Object.keys(incoming.etablissements).forEach(function (id) {
              if (db.etablissements[id]) { var old = [id].concat(batsOf(id).map(function (b) { return b.id; })); purgeOwners(old); old.slice(1).forEach(function (b) { delete db.batiments[b]; }); }
            });
            ['etablissements', 'batiments', 'documents', 'docs_perso', 'contrats'].forEach(function (k) { Object.assign(db[k], incoming[k]); });
          }
          markDirty(); location.hash = '#/'; render();
          toast('Import terminé : ' + nE + ' établissement(s), ' + files.length + ' fichier(s)');
          return relocateFiles();
        });
      });
    }).catch(function (e) { toast('Import impossible : ' + e.message, 'ko'); });
  }

  /* ------------------------------------------------------------------ */
  /* Démarrage                                                            */
  /* ------------------------------------------------------------------ */
  function boot() {
    renderAll();
    if (!FS_OK) {
      store = { mode: 'browser', dir: null };
      try { var t = localStorage.getItem(CACHE_KEY); if (t) { db = normalize(JSON.parse(t)); } } catch (e) { toast('Données du navigateur illisibles : ' + e.message, 'ko'); }
      renderAll(); render(); return;
    }
    idbGet('handles', HANDLE_KEY).then(function (h) {
      if (!h) { store = { mode: 'none', dir: null }; return; }
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') { return connect(h); }
        store = { mode: 'reauth', dir: h };
      });
    }).catch(function (e) {
      console.error(e); store = { mode: 'none', dir: null };
      toast(e.message, 'ko');
    }).then(function () { renderAll(); if (store.mode !== 'folder') { render(); } });
  }
  window.FSJD_TEST = { get db() { return db; }, flush: flush, buildZip: buildZip, readZip: readZip, connect: connect, store: function () { return store; } };
  boot();
})();
</script>
